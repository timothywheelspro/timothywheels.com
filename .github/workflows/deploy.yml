name: Verify production (Cloudflare Pages)

# Update -> smoke test -> roll back if it fails.
# Cloudflare Pages builds and publishes every push to main on its own. This workflow
# then holds the live site to the smoke test:
#   1. wait     : wait for Cloudflare's production deploy of this commit to finish.
#   2. verify   : smoke-test the live site. On pass, tag this commit `last-good-deploy`.
#   3. rollback : only if verify fails. Use Cloudflare's "roll back to a previous deployment"
#                 to put the last good deploy back, re-check it, and open an issue.
# If Cloudflare's own build fails, nothing new went live; we just open an issue.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CF_PAGES_PROJECT: timothywheels-com

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to move the last-good-deploy tag
    outputs:
      build: ${{ steps.wait.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Cloudflare's production deploy of this commit
        id: wait
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not set; waiting 3 minutes instead and rollback is disabled"
            sleep 180; echo "status=unknown" >> "$GITHUB_OUTPUT"
          else
            python3 tools/cf-pages.py wait "$GITHUB_SHA"
          fi

      - name: Cloudflare build failed, so nothing new went live
        if: steps.wait.outputs.status == 'failure' || steps.wait.outputs.status == 'timeout'
        run: |
          echo "::error::Cloudflare production deploy for ${GITHUB_SHA::7} ended as '${{ steps.wait.outputs.status }}'. The previous version is still live."
          exit 1

      - name: Smoke test the live site
        if: steps.wait.outputs.status != 'skipped'
        run: python3 tools/smoke-test.py --retries 8 --wait 20

      - name: Mark this commit as the last good deploy
        run: |
          git tag -f last-good-deploy "$GITHUB_SHA"
          git push -f origin refs/tags/last-good-deploy

  rollback:
    runs-on: ubuntu-latest
    needs: verify
    if: failure() && needs.verify.result == 'failure'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Roll production back to the last good deploy
        id: rb
        # A failed Cloudflare build never went live, so there is nothing to roll back.
        if: needs.verify.outputs.build != 'failure' && needs.verify.outputs.build != 'timeout'
        continue-on-error: true
        run: python3 tools/cf-pages.py rollback "$GITHUB_SHA"

      - name: Re-check the live site
        id: recheck
        if: steps.rb.outcome == 'success'
        continue-on-error: true
        run: python3 tools/smoke-test.py --retries 6 --wait 20

      - name: Open an issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD: ${{ needs.verify.outputs.build }}
          RB: ${{ steps.rb.outcome }}
          TO: ${{ steps.rb.outputs.rolled_back_to }}
          RECHECK: ${{ steps.recheck.outcome }}
        run: |
          BAD=${GITHUB_SHA::7}
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$BUILD" = "failure" ] || [ "$BUILD" = "timeout" ]; then
            TITLE="Cloudflare build for $BAD did not finish ($BUILD); previous version still live"
            BODY="Cloudflare Pages did not publish commit \`$BAD\`. Nothing changed on the live site. Check the build log in Cloudflare, fix forward, and merge again. Run: $RUN"
          elif [ "$RB" = "success" ]; then
            TITLE="Deploy $BAD failed its live smoke test; rolled back to $TO"
            BODY="Commit \`$BAD\` went live but failed the smoke test. Production was rolled back on Cloudflare Pages to \`$TO\`. Re-check after rollback: **$RECHECK**. Fix forward on a branch, then merge. Run: $RUN"
          else
            TITLE="Deploy $BAD failed its live smoke test; automatic rollback did not run"
            BODY="Commit \`$BAD\` failed the live smoke test and the rollback step did not succeed (outcome: $RB). Roll back by hand in Cloudflare: Workers & Pages > $CF_PAGES_PROJECT > Deployments > pick the last good one > Rollback. Run: $RUN"
          fi
          gh issue create --title "$TITLE" --body "$BODY"
