name: Deploy Hugo to GitHub Pages

# Update -> smoke test -> roll back if it fails. The rollback rule is decided here,
# before anything breaks, not during an outage.
#   1. build   : build the site and smoke-test the build locally. A broken build never ships.
#   2. deploy  : publish to GitHub Pages.
#   3. verify  : smoke-test the LIVE site. On pass, tag this commit `last-good-deploy`.
#   4. rollback: only if verify fails. Rebuild `last-good-deploy`, redeploy it,
#                re-check it, and open an issue saying what happened.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HUGO_VERSION: "0.155.0"
  SITE_URL: "https://timothywheels.com/"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build
        run: hugo --gc --minify -F --baseURL "$SITE_URL"

      - name: Smoke test the build (pre-deploy gate)
        run: |
          (cd public && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          python3 tools/smoke-test.py --base http://localhost:8000

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write   # to move the last-good-deploy tag
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test the live site
        run: python3 tools/smoke-test.py --retries 8 --wait 20

      - name: Mark this commit as the last good deploy
        run: |
          git tag -f last-good-deploy "$GITHUB_SHA"
          git push -f origin refs/tags/last-good-deploy

  rollback:
    runs-on: ubuntu-latest
    needs: verify
    if: failure() && needs.verify.result == 'failure'
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.redeploy.outputs.page_url }}
    steps:
      - name: Check out the last good deploy
        uses: actions/checkout@v4
        with:
          ref: last-good-deploy
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Rebuild last good version
        run: hugo --gc --minify -F --baseURL "$SITE_URL"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Redeploy last good version
        id: redeploy
        uses: actions/deploy-pages@v5

      - name: Re-check the live site
        id: recheck
        continue-on-error: true
        run: python3 tools/smoke-test.py --retries 8 --wait 20

      - name: Open an issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GOOD=$(git rev-parse --short HEAD)
          BAD=${GITHUB_SHA::7}
          STATUS="${{ steps.recheck.outcome }}"
          gh issue create \
            --title "Deploy $BAD failed its live smoke test and was rolled back to $GOOD" \
            --body "Commit \`$BAD\` deployed, but the live site failed the smoke test.

          The site was rebuilt from \`last-good-deploy\` (\`$GOOD\`) and redeployed. Re-check after rollback: **$STATUS**.

          Run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Fix forward on a branch, then merge. The next passing deploy moves \`last-good-deploy\` again."
