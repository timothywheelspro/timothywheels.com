name: PR smoke test

# Every change, including Dependabot updates, has to build and pass the
# smoke test before it can reach main.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.158.0"
          extended: true

      - name: Build
        run: hugo --gc --minify -F --baseURL "https://timothywheels.com/"

      - name: Smoke test the build
        run: |
          (cd public && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          python3 tools/smoke-test.py --base http://localhost:8000
