{{- define "main" }}
<style>
  .main:has(> .comic-issue) { max-width: 1080px; padding-inline: 0; }
  .comic-issue .post-header,
  .comic-issue .post-content > p:not(:has(> .comic-slide)) { padding-inline: var(--gap); }
  .comic-issue .comic-slide { display: block; width: 100%; height: auto; margin: 0 auto 1rem; border-radius: 0; }
</style>

<article class="post-single comic-issue">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    <div class="post-meta">{{ .Date | time.Format "January 2, 2006" }}</div>
  </header>
  <div class="post-content">
    <p>{{ .Description }}</p>
    {{- if .Params.sound }}{{ partial "comic-sound.html" . }}{{ end }}
    {{ .Content }}
  </div>
</article>
<script>
  // Motion panels: honor reduced-motion by showing the still poster instead of the loop.
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('.comic-issue video').forEach(function (v) {
      v.removeAttribute('autoplay'); v.pause(); v.load();
    });
  }
</script>
{{- end }}
